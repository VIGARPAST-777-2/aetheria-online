<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Eldoria: Shadows of the Forgotten Ring</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <div id="auth-screen" class="screen">
      <div class="panel">
        <h1>Eldoria</h1>
        <p class="subtitle">Shadows of the Forgotten Ring</p>
        <p class="flavor">Una historia de fantasía medieval pixel art<br>inspirada en el Señor de los Anillos y Mario RPG</p>

        <div id="auth-form">
          <input type="email" id="email" placeholder="Email" autocomplete="email" required />
          <input type="password" id="password" placeholder="Contraseña (mín. 8 caracteres)" autocomplete="current-password" minlength="8" required />
          <button id="btn-login">Iniciar Sesión</button>
          <button id="btn-register" class="secondary">Crear Cuenta</button>
        </div>
        <p id="auth-error" class="error"></p>
        <p class="hint">Debes registrarte e iniciar sesión para jugar.<br>Tus partidas se guardan de forma segura.<br><br>📱 Compatible con móvil y PC</p>
      </div>
    </div>

    <div id="char-screen" class="screen hidden">
      <div class="panel wide">
        <h2>Tu Aventura</h2>
        <div id="char-list"></div>
        <hr style="border-color:#4a3528; margin:1rem 0" />
        <h3>Nueva Partida</h3>
        <input type="text" id="char-name" placeholder="Nombre del héroe" maxlength="16" />
        <select id="char-class">
          <option value="warrior">Guerrero - Espada y escudo</option>
          <option value="mage">Mago - Magia arcana</option>
          <option value="ranger">Explorador - Arco y sigilo</option>
          <option value="rogue">Pícaro - Dagas y velocidad</option>
        </select>
        <button id="btn-create-char">Comenzar Historia</button>
        <p id="char-error" class="error"></p>
        <button id="btn-logout" class="secondary" style="margin-top:1rem">Cerrar Sesión</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
