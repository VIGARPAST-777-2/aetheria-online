<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria Online - Pixel Art MMO RPG</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">
    <!-- Login / Character Select -->
    <div id="auth-screen" class="screen">
      <div class="panel">
        <h1>Aetheria Online</h1>
        <p class="subtitle">Pixel Art Top-Down MMO RPG</p>
        <div id="auth-form">
          <input type="email" id="email" placeholder="Email" />
          <input type="password" id="password" placeholder="Password" />
          <button id="btn-login">Entrar</button>
          <button id="btn-register">Registrarse</button>
          <button id="btn-guest" class="secondary">Jugar como invitado</button>
        </div>
        <p id="auth-error" class="error"></p>
      </div>
    </div>

    <!-- Character Creation / Select -->
    <div id="char-screen" class="screen hidden">
      <div class="panel wide">
        <h2>Tus Personajes</h2>
        <div id="char-list"></div>
        <hr />
        <h3>Crear nuevo</h3>
        <input type="text" id="char-name" placeholder="Nombre del personaje" maxlength="16" />
        <select id="char-class">
          <option value="warrior">Warrior - Tanque y melee</option>
          <option value="mage">Mage - Magia y control</option>
          <option value="ranger">Ranger - Distancia y exploration</option>
          <option value="rogue">Rogue - Sigilo y crits</option>
        </select>
        <button id="btn-create-char">Crear Personaje</button>
        <p id="char-error" class="error"></p>
      </div>
    </div>

    <!-- Game -->
    <div id="game-screen" class="screen hidden">
      <div id="game-container"></div>
      <div id="ui">
        <div id="player-info">
          <span id="player-name">---</span>
          <span id="player-level">Lv.1</span>
          <span id="player-gold">🪙 0</span>
        </div>
        <div id="chat-box">
          <div id="chat-messages"></div>
          <input type="text" id="chat-input" placeholder="Escribe un mensaje..." maxlength="200" />
        </div>
        <div id="controls-hint">WASD / Flechas para mover • Enter para chat</div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
